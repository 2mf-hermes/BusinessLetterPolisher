<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Polisher</title>
<style>
/* ============================================================
   Apple Design System — iOS 26 / macOS 26 Glass Style
   ============================================================ */

/* ===== Theme Tokens ===== */
:root{
  /* Surface */
  --bg:#0C1117;--bg2:#131A24;--bg3:#090D12;
  --sf:rgba(30,34,44,.62);--sfh:rgba(22,26,36,.88);
  --sfhov:rgba(40,46,60,.7);--sfi:rgba(255,255,255,.05);
  /* Border */
  --bd:rgba(255,255,255,.08);--bdh:rgba(255,255,255,.14);
  /* Text */
  --tx:#F2F2F7;--tx2:#989BA0;--tx3:#63666A;
  /* Accent — Apple system blue */
  --ac:#0A84FF;--ac2:#409CFF;--acg:rgba(10,132,255,.12);
  --ac3:#5E5CE6;--ac-rg:10,132,255;
  /* Semantic */
  --ok:#30D158;--wn:#FF9F0A;--er:#FF453A;
  /* Elevation */
  --sh:0 0 0 .5px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.15),0 12px 40px rgba(0,0,0,.2);
  --sh-sm:0 0 0 .5px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.1);
  --bl:blur(40px) saturate(1.8);
  /* Radii — Apple system */
  --r:16px;--r2:12px;--r3:10px;--rp:20px;
  /* Timing */
  --ease:cubic-bezier(.25,.1,.25,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme="light"]{
  --bg:#F2F2F7;--bg2:#E5E5EA;--bg3:#F8F8FA;
  --sf:rgba(255,255,255,.72);--sfh:rgba(255,255,255,.92);
  --sfhov:rgba(255,255,255,.95);--sfi:rgba(0,0,0,.04);
  --bd:rgba(0,0,0,.09);--bdh:rgba(0,0,0,.16);
  --tx:#1C1C1E;--tx2:#8E8E93;--tx3:#C7C7CC;
  --ac:#007AFF;--ac2:#0063D1;--acg:rgba(0,122,255,.1);
  --ac3:#5856D6;--ac-rg:0,122,255;
  --ok:#34C759;--wn:#FF9500;--er:#FF3B30;
  --sh:0 0 0 .5px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.06),0 12px 40px rgba(0,0,0,.1);
  --sh-sm:0 0 0 .5px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
}

/* ===== Reset & Base ===== */
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Noto Sans TC","Segoe UI",sans-serif;
  background:linear-gradient(165deg,var(--bg) 0%,var(--bg2) 40%,var(--bg3) 100%);
  background-attachment:fixed;color:var(--tx);line-height:1.5;
  min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:50vh;background:radial-gradient(ellipse 70% 50% at 50% -10%,var(--acg),transparent);pointer-events:none;z-index:0;}

/* ===== Header — iOS navigation bar ===== */
header{
  background:var(--sfh);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);
  padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;
  border-bottom:0.5px solid var(--bd);position:sticky;top:0;z-index:100;
}
.logo{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--ac),var(--ac3));
  border-radius:8px;color:#fff;box-shadow:0 1px 6px rgba(var(--ac-rg),.3);
}
.logo svg{width:17px;height:17px;}
header h1{font-size:15px;font-weight:600;color:var(--tx);letter-spacing:-.2px;}
.h-spacer{flex:1;}
.h-ctrls{display:flex;align-items:center;gap:8px;}

/* ===== Apple Custom Select / Menu ===== */
.cs{position:relative;user-select:none;}
.cs-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 26px 6px 10px;border:0.5px solid var(--bd);
  border-radius:var(--r3);font-size:12px;font-weight:500;
  color:var(--tx);background:var(--sfi);cursor:pointer;
  font-family:inherit;transition:all .18s var(--ease);
  white-space:nowrap;min-width:0;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.cs-btn:hover{background:rgba(var(--ac-rg),.06);border-color:rgba(var(--ac-rg),.2);}
.cs-btn:active{transform:scale(.96);transition-duration:.08s;}
.cs-btn.open{border-color:rgba(var(--ac-rg),.3);background:rgba(var(--ac-rg),.08);box-shadow:0 0 0 3px rgba(var(--ac-rg),.1);}
.cs-icon{display:inline-flex;width:14px;height:14px;flex-shrink:0;color:var(--tx2);}
.cs-arr{width:10px;height:10px;flex-shrink:0;color:var(--tx3);transition:transform .2s var(--spring);}
.cs-btn.open .cs-arr{transform:rotate(180deg);}

/* Dropdown panel — iOS popover glass */
.cs-dd{
  position:absolute;top:calc(100% + 5px);left:0;
  min-width:100%;width:fit-content;
  background:var(--sfh);backdrop-filter:blur(48px) saturate(2);-webkit-backdrop-filter:blur(48px) saturate(2);
  border:0.5px solid var(--bd);border-radius:var(--r2);
  box-shadow:var(--sh);z-index:200;padding:4px;
  opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;
  transition:all .18s var(--spring);
}
.cs-dd.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.cs-dd-up{top:auto;bottom:calc(100% + 5px);transform:translateY(4px) scale(.98);}
.cs-dd-up.open{transform:translateY(0) scale(1);}

/* Options — iOS menu items */
.cs-opt{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-radius:8px;font-size:13px;font-weight:400;
  color:var(--tx2);cursor:pointer;transition:all .12s var(--ease);
  line-height:1.4;white-space:nowrap;
}

.cs-opt:hover{background:rgba(var(--ac-rg),.08);color:var(--tx);}
.cs-opt.sel{color:var(--ac);font-weight:500;background:rgba(var(--ac-rg),.06);}
.cs-opt:active{transform:scale(.98);transition-duration:.06s;}
/* iOS-style checkmark indicator */
.cs-chk{font-size:14px;font-weight:600;color:var(--ac);width:18px;text-align:center;opacity:0;transition:opacity .15s;}
.cs-opt.sel .cs-chk{opacity:1;}
/* Hide legacy dot indicators */
.cs-dot{display:none!important;}

/* Header compact select */
.h-cs .cs-btn{padding:5px 22px 5px 9px;font-size:11px;}
.h-cs .cs-opt{padding:6px 10px;font-size:12px;}

/* ===== Layout ===== */
.wrap{max-width:1120px;margin:0 auto;padding:20px 24px;display:grid;gap:20px;position:relative;z-index:1;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:860px){.row2{grid-template-columns:1fr;}}

/* ===== Cards — Apple glass material ===== */
.card{
  background:var(--sf);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);
  border-radius:var(--r);box-shadow:var(--sh);
  padding:22px;border:0.5px solid var(--bd);
  transition:border-color .3s var(--ease);position:relative;overflow:visible;
}
.card:hover{border-color:var(--bdh);}
/* Top accent line — subtle gradient bar */
.card::before{
  content:'';position:absolute;top:0;left:24px;right:24px;height:2px;
  border-radius:0 0 2px 2px;opacity:.5;transition:opacity .3s;
}
.card:hover::before{opacity:.85;}
.card-inp::before{background:linear-gradient(90deg,transparent,var(--ac),transparent);}
.card-out::before{background:linear-gradient(90deg,transparent,var(--ok),transparent);}
.card-t{
  font-size:13px;font-weight:600;margin-bottom:16px;color:var(--tx);
  display:flex;align-items:center;gap:8px;letter-spacing:-.1px;
}
.card-t svg{width:15px;height:15px;opacity:.5;}

/* ===== Form — Apple-style aligned grid ===== */
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:6px;}
.opts-grid>.fg:has(#letterLangCS){order:1;}
.opts-grid>.fg:has(#outLangCS){order:2;}
.opts-grid>.fg:has(#toneCS){order:3;}
.opts-grid>.fg:has(#polishModeCS){order:4;}
.opts-grid>.fg:has(#purposeCS){order:5;grid-column:1/-1;}
@media(max-width:520px){.opts-grid{grid-template-columns:1fr;gap:10px;}.opts-grid>.fg:has(#purposeCS){grid-column:1;}}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg>label{
  font-size:11px;font-weight:500;color:var(--tx2);letter-spacing:.3px;
  text-transform:uppercase;height:16px;line-height:16px;
}
.fg .cs-btn{width:100%;justify-content:space-between;}
.fg .cs{width:100%;}
.cs-dd{max-height:320px;overflow-y:auto;}
.fg input,.fg textarea{
  padding:9px 12px;border:0.5px solid var(--bd);border-radius:var(--r3);
  font-size:13px;color:var(--tx);background:var(--sfi);
  transition:all .2s var(--ease);font-family:inherit;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.fg input:hover,.fg textarea:hover{border-color:var(--bdh);}
.fg input:focus,.fg textarea:focus{
  outline:none;border-color:var(--ac);
  box-shadow:0 0 0 3.5px rgba(var(--ac-rg),.12);
}
.fg input::placeholder,.fg textarea::placeholder{color:var(--tx3);}
.fg .mono{font-family:"SF Mono","Cascadia Code","Fira Code",monospace;font-size:12px;}

/* ===== Chips ===== */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.chip{
  padding:5px 12px;border-radius:var(--rp);font-size:11px;font-weight:500;
  cursor:pointer;border:0.5px solid var(--bd);background:var(--sfi);
  color:var(--tx2);transition:all .2s var(--ease);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.chip:hover{border-color:rgba(var(--ac-rg),.25);color:var(--ac);background:rgba(var(--ac-rg),.06);}
.chip:active{transform:scale(.95);transition-duration:.06s;}
.chip.on{background:rgba(var(--ac-rg),.12);color:var(--ac);border-color:rgba(var(--ac-rg),.3);}

/* ===== Textarea ===== */
.ta{
  width:100%;min-height:260px;padding:14px;border:0.5px solid var(--bd);
  border-radius:var(--r2);font-size:13px;line-height:1.9;resize:vertical;
  font-family:inherit;color:var(--tx);background:var(--sfi);
  transition:all .2s var(--ease);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.ta:hover{border-color:var(--bdh);}
.ta:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3.5px rgba(var(--ac-rg),.12);}
.ta::placeholder{color:var(--tx3);}
.ta.out{background:rgba(var(--ac-rg),.03);border-color:rgba(var(--ac-rg),.1);}
[data-theme="light"] .ta.out{background:rgba(var(--ac-rg),.03);border-color:rgba(var(--ac-rg),.12);}
.cnt{font-size:11px;color:var(--tx3);text-align:right;margin-top:4px;}

/* ===== Buttons — Apple system style ===== */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 18px;border:none;border-radius:var(--rp);
  font-size:13px;font-weight:600;cursor:pointer;
  transition:all .18s var(--ease);font-family:inherit;
  letter-spacing:-.1px;line-height:1;
}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn:disabled{opacity:.3;cursor:not-allowed;}
.btn:active:not(:disabled){transform:scale(.96);transition-duration:.06s;}

/* Primary — Apple blue pill */
.btn-p{
  background:var(--ac);color:#fff;
  background-image:linear-gradient(to bottom,rgba(255,255,255,.15),rgba(0,0,0,.08));
  box-shadow:0 1px 3px rgba(var(--ac-rg),.3),inset 0 .5px 0 rgba(255,255,255,.12);
}
.btn-p:hover:not(:disabled){
  filter:brightness(1.08);
  box-shadow:0 2px 8px rgba(var(--ac-rg),.35),inset 0 .5px 0 rgba(255,255,255,.12);
  transform:translateY(-.5px);
}
.btn-p:active:not(:disabled){transform:scale(.96);filter:brightness(.95);}

/* Secondary — glass */
.btn-s{
  background:var(--sfi);color:var(--tx);border:0.5px solid var(--bd);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.btn-s:hover{background:rgba(var(--ac-rg),.06);border-color:rgba(var(--ac-rg),.18);color:var(--ac);}

/* Green */
.btn-g{background:var(--ok);color:#fff;box-shadow:0 1px 3px rgba(48,209,88,.25);}
.btn-g:hover{filter:brightness(1.08);}

/* Red */
.btn-d{background:var(--er);color:#fff;box-shadow:0 1px 3px rgba(255,69,58,.25);}
.btn-d:hover{filter:brightness(1.08);}

.btn-sm{padding:6px 14px;font-size:11px;}
.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}

/* ===== Spinner ===== */
.sp{display:inline-block;width:12px;height:12px;border:1.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== Status ===== */
.sts{padding:9px 12px;border-radius:var(--r3);font-size:12px;display:none;align-items:center;gap:5px;margin-top:7px;}
.sts.show{display:flex;}
.sts.info{background:var(--acg);color:var(--ac);border:0.5px solid rgba(var(--ac-rg),.12);}
.sts.ok{background:rgba(48,209,88,.08);color:var(--ok);border:0.5px solid rgba(48,209,88,.12);}
.sts.err{background:rgba(255,69,58,.08);color:var(--er);border:0.5px solid rgba(255,69,58,.12);}

/* ===== Tabs — iOS segmented feel ===== */
.tabs{display:flex;gap:0;border-bottom:0.5px solid var(--bd);margin-bottom:14px;}
.tab{
  padding:8px 14px;font-size:12px;font-weight:500;cursor:pointer;
  color:var(--tx3);border-bottom:2px solid transparent;
  margin-bottom:-0.5px;transition:all .2s var(--ease);
}
.tab:hover{color:var(--tx2);}
.tab.on{color:var(--ac);border-bottom-color:var(--ac);}
.tp{display:none;}.tp.on{display:block;}

/* ===== Performance badge ===== */
.pf{font-size:10px;padding:2px 8px;border-radius:10px;margin-left:auto;font-weight:500;display:none;letter-spacing:.1px;}
.pf.show{display:inline-flex;align-items:center;}
.pf.fast{background:rgba(48,209,88,.1);color:var(--ok);}
.pf.med{background:rgba(255,159,10,.1);color:var(--wn);}
.pf.slow{background:rgba(255,69,58,.1);color:var(--er);}

/* ===== Custom input areas ===== */
.cust{margin-bottom:10px;display:none;animation:fadeSlideIn .2s var(--ease);}
.cust.show{display:block;}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.cust>label{font-size:11px;font-weight:600;color:var(--tx2);margin-bottom:4px;display:block;}
.cust input{
  width:100%;padding:9px 12px;border:0.5px solid var(--bd);border-radius:var(--r3);
  font-size:13px;font-family:inherit;color:var(--tx);background:var(--sfi);transition:all .2s var(--ease);
}
.cust input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3.5px rgba(var(--ac-rg),.12);}
.cust-h{font-size:10px;color:var(--tx3);margin-top:3px;}
.custom-prompt{margin-top:10px;padding:12px;background:var(--sfi);border:0.5px solid var(--bd);border-radius:var(--r2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.custom-prompt label{font-size:11px;font-weight:600;color:var(--tx2);margin-bottom:5px;display:block;}
.custom-prompt textarea{
  width:100%;min-height:72px;padding:9px;border:0.5px solid var(--bd);
  border-radius:var(--r3);font-size:12px;font-family:inherit;resize:vertical;
  background:var(--sfi);color:var(--tx);transition:all .2s var(--ease);
}
.custom-prompt textarea::placeholder{color:var(--tx3);}

/* ===== FABs — Apple-style floating action ===== */
.fab{
  position:fixed;width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:900;transition:all .2s var(--spring);user-select:none;
}
.fab:hover{transform:scale(1.08);}
.fab:active{transform:scale(.9);transition-duration:.06s;}
.fab svg{width:18px;height:18px;}
.fab .tip{
  position:absolute;bottom:56px;right:0;
  background:var(--sfh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--tx);font-size:11px;padding:5px 10px;border-radius:8px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s var(--ease);
  border:0.5px solid var(--bd);box-shadow:var(--sh-sm);
}
.fab:hover .tip{opacity:1;}
.fab-s{
  bottom:24px;right:24px;background:var(--sf);
  border:0.5px solid var(--bd);color:var(--tx2);box-shadow:var(--sh);
}
.fab-s.on{background:var(--er);color:#fff;border-color:transparent;box-shadow:0 2px 12px rgba(255,69,58,.3);}
.fab-h{
  bottom:24px;right:82px;background:var(--sf);
  border:0.5px solid var(--bd);color:var(--tx2);box-shadow:var(--sh);
}
.fab-h.on{background:var(--ac3);color:#fff;border-color:transparent;box-shadow:0 2px 12px rgba(var(--ac-rg),.3);}
.fab .bdg{
  position:absolute;top:-3px;right:-3px;background:var(--er);
  color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:600;padding:0 3px;
}
.fab .bdg.off{display:none;}

/* ===== Overlay + Panel — iOS sheet ===== */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:950;display:none;justify-content:flex-end;align-items:stretch;
}
.ov.open{display:flex;}
.panel{
  width:500px;max-width:90vw;height:100vh;max-height:100vh;background:var(--sfh);
  backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);
  box-shadow:-8px 0 48px rgba(0,0,0,.25);overflow:hidden;padding:26px;
  animation:slideIn .28s var(--spring);border-left:0.5px solid var(--bd);
  display:flex;flex-direction:column;
}
.panel.hist{width:420px;max-width:88vw;}
.panel>.ph{flex:0 0 auto;}
.panel-body{flex:1 1 auto;min-height:0;overflow-y:auto;max-height:none;padding-bottom:18px;}
.pref-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0;}
.pref-row .pref-text{font-size:12px;color:var(--tx2);line-height:1.5;}
.pref-switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);cursor:pointer;}
.pref-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
@keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.ph{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;padding-bottom:14px;border-bottom:0.5px solid var(--bd);
}
.ph h2{font-size:16px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:8px;letter-spacing:-.2px;}
.ph h2 svg{width:18px;height:18px;opacity:.45;}
.px{
  width:28px;height:28px;border-radius:50%;border:none;
  background:var(--sfi);color:var(--tx2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s var(--ease);
}
.px svg{width:11px;height:11px;}
.px:hover{background:rgba(var(--ac-rg),.08);color:var(--tx);}
.px:active{transform:scale(.88);transition-duration:.06s;}
.ps{margin-bottom:14px;padding-bottom:14px;border-bottom:0.5px solid var(--bd);}
.ps:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.ps-t{font-size:10px;font-weight:600;color:var(--tx3);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase;}

/* ===== History ===== */
.hl{max-height:calc(100vh - 160px);overflow-y:auto;}
.hi{
  padding:11px;border:0.5px solid var(--bd);border-radius:var(--r2);
  margin-bottom:7px;cursor:pointer;transition:all .2s var(--ease);
  background:var(--sfi);
}
.hi:hover{border-color:rgba(var(--ac-rg),.2);background:rgba(var(--ac-rg),.06);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.1);}
.hi:active{transform:scale(.98);transition-duration:.06s;}
.hi .hm{font-size:10px;color:var(--tx3);margin-bottom:3px;display:flex;justify-content:space-between;}
.hi .hp{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hi .ht{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.tg{font-size:9px;padding:2px 8px;border-radius:10px;background:rgba(var(--ac-rg),.08);color:var(--ac);font-weight:500;}

/* ===== Diff ===== */
.df-o{background:rgba(255,69,58,.07);text-decoration:line-through;padding:2px 6px;border-radius:4px;color:var(--er);}
.df-n{background:rgba(48,209,88,.07);padding:2px 6px;border-radius:4px;color:var(--ok);}

/* ===== Modal ===== */
.mo{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:1000;display:none;justify-content:center;align-items:center;
}
.mo.show{display:flex;}
.mo-c{
  background:var(--sfh);backdrop-filter:var(--bl);-webkit-backdrop-filter:var(--bl);
  border-radius:var(--r);padding:24px;max-width:580px;width:90%;max-height:80vh;
  overflow-y:auto;box-shadow:var(--sh);border:0.5px solid var(--bd);
  animation:modalIn .22s var(--spring);
}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.mo-c h3{margin-bottom:14px;font-size:16px;color:var(--tx);font-weight:700;letter-spacing:-.2px;}
.mo-c .dt{white-space:pre-wrap;font-size:13px;line-height:1.8;color:var(--tx2);}
.mo-c .btns{margin-top:14px;justify-content:flex-end;}

/* ===== Onboarding Guide ===== */
.guide-ov{
  position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease);
}
.guide-ov.open{opacity:1;pointer-events:auto;}
.guide-card{
  width:480px;max-width:calc(100vw - 40px);max-height:calc(100vh - 32px);
  background:var(--sfh);backdrop-filter:blur(48px) saturate(2);-webkit-backdrop-filter:blur(48px) saturate(2);
  border:0.5px solid var(--bd);border-radius:18px;
  box-shadow:0 24px 80px rgba(0,0,0,.25),0 0 0 0.5px var(--bd);
  overflow-y:auto;overflow-x:hidden;transform:scale(.92) translateY(16px);transition:transform .4s var(--spring);
  overscroll-behavior:contain;
}
.guide-ov.open .guide-card{transform:scale(1) translateY(0);}
.guide-step{display:none;padding:36px 32px 28px;animation:guideFadeIn .35s var(--ease);}
.guide-step.on{display:block;}
@keyframes guideFadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.guide-icon{
  width:56px;height:56px;border-radius:16px;margin:0 auto 20px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--ac),var(--ac3));
  box-shadow:0 4px 16px rgba(var(--ac-rg),.25);
}
.guide-icon svg{width:28px;height:28px;color:#fff;}
.guide-step h3{
  font-size:18px;font-weight:600;color:var(--tx);text-align:center;
  letter-spacing:-.3px;margin-bottom:6px;
}
.guide-step p{
  font-size:13px;color:var(--tx2);text-align:center;line-height:1.7;margin-bottom:0;
}
.guide-step p.guide-sub{font-size:12px;color:var(--tx3);margin-top:4px;}
.guide-list{margin:18px 0 0;padding:0;list-style:none;counter-reset:guideNum;}
.guide-list li{
  counter-increment:guideNum;position:relative;
  padding:10px 12px 10px 44px;margin-bottom:6px;
  border-radius:10px;font-size:13px;color:var(--tx2);line-height:1.6;
  background:var(--sfi);border:0.5px solid var(--bd);
}
.guide-list li::before{
  content:counter(guideNum);position:absolute;left:12px;top:10px;
  width:22px;height:22px;border-radius:50%;
  background:var(--ac);color:#fff;font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
.guide-list li b{color:var(--tx);font-weight:500;}
.guide-dots{display:flex;justify-content:center;gap:7px;padding:0 32px 24px;}
.guide-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--bd);transition:all .25s var(--ease);
}
.guide-dot.on{background:var(--ac);width:20px;border-radius:4px;}
.guide-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px 24px;gap:8px;
}
.guide-nav .btn{font-size:13px;padding:8px 20px;}
.guide-skip{background:none;border:none;color:var(--tx3);font-size:12px;cursor:pointer;padding:8px 4px;font-family:inherit;}
.guide-skip:hover{color:var(--tx2);}

/* ===== Toast ===== */
.toast{
  position:fixed;bottom:84px;right:24px;
  padding:10px 20px;border-radius:var(--rp);
  background:var(--sfh);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  color:var(--tx);font-size:12px;font-weight:500;z-index:9999;
  opacity:0;transform:translateY(8px) scale(.95);
  transition:all .22s var(--spring);pointer-events:none;
  box-shadow:var(--sh);border:0.5px solid var(--bd);
  display:flex;align-items:center;gap:6px;
}
.toast.show{opacity:1;transform:translateY(0) scale(1);}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(var(--ac-rg),.15);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--ac-rg),.25);}
</style>

  var st=Date.now();
  try{var r;if(cfg.apiFormat==='anthropic')r=await callAnthropic(input,sysPrompt);else if(cfg.apiFormat==='gemini')r=await callGemini(input,sysPrompt);else r=await callOpenAI(input,sysPrompt);
  var el2=((Date.now()-st)/1000).toFixed(1);var pt=r.split('--- Suggestions ---');var polished=pt[0].trim();var sug=pt.length>1?pt[1].trim():'';
  $('letterOut').value=polished;$('diffV').innerHTML=diffHTML(input,polished);
  $('sugV').innerHTML=sug?sug.replace(/\n/g,'<br>'):'<span style="color:var(--tx3)">'+esc(t('noSug'))+'</span>';
  lastRes={original:input,polished:polished,suggestions:sug};
  var pb=$('pfB');pb.textContent=el2+'s';pb.className='pf show '+(el2<3?'fast':el2<10?'med':'slow');
  showSts(t('polishDone')+' ('+el2+'s)','ok');addH(input,polished,sug,t(tK),t(pK));
  }catch(err){showSts('Error: '+err.message,'err');}
  finally{btn.disabled=false;txt.textContent=t('startPolish');}
}
async function callOpenAI(t2,sp){var r=await fetch(cfg.apiUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},body:JSON.stringify({model:cfg.modelName,temperature:cfg.temperature,messages:[{role:'system',content:sp},{role:'user',content:t2}]})});if(!r.ok){var b=await r.text();throw new Error(r.status+': '+b.substring(0,200));}var d=await r.json();if(d.choices&&d.choices[0]&&d.choices[0].message)return d.choices[0].message.content||'';throw new Error('Unexpected response');}
async function callAnthropic(t2,sp){var r=await fetch(cfg.apiUrl,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':cfg.apiKey,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:cfg.modelName,max_tokens:4096,temperature:cfg.temperature,system:sp,messages:[{role:'user',content:t2}]})});if(!r.ok){var b=await r.text();throw new Error(r.status+': '+b.substring(0,200));}var d=await r.json();if(d.content&&d.content[0])return d.content[0].text||'';throw new Error('Unexpected response');}
async function callGemini(t2,sp){var url=cfg.apiUrl.replace('GEMINI_MODEL',cfg.modelName);var r=await fetch(url+'?key='+cfg.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:sp+'\n\n---\n\n'+t2}]}],generationConfig:{temperature:cfg.temperature}})});if(!r.ok){var b=await r.text();throw new Error(r.status+': '+b.substring(0,200));}var d=await r.json();if(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)return d.candidates[0].content.parts[0].text||'';throw new Error('Unexpected response');}
function showSts(m,tp){var el=$('sts');el.innerHTML='';var msg=document.createElement('span');msg.style.flex='1';msg.textContent=m;var close=document.createElement('button');close.type='button';close.className='px';close.setAttribute('aria-label',t('close'));close.textContent='×';close.onclick=function(){el.classList.remove('show');};el.appendChild(msg);el.appendChild(close);el.className='sts show '+tp;}

/* ===== Test ===== */
async function testConn(){
  autoSave();if(!cfg.apiUrl||!cfg.apiKey){showTR(t('testFill'),'err');return;}
  var btn=$('testBtn'),ot=btn.textContent;btn.disabled=true;btn.innerHTML='<span class="sp" style="border-color:rgba(255,255,255,.15);border-top-color:var(--ac)"></span> '+t('testing');
  showTR(t('testing'),'info');
  try{var r;if(cfg.apiFormat==='anthropic')r=await callAnthropic('Hello.','Reply OK');else if(cfg.apiFormat==='gemini')r=await callGemini('Hello.','Reply OK');else r=await callOpenAI('Hello.','Reply OK');showTR(t('testOk')+': '+r.substring(0,60),'ok');}
  catch(e){showTR(t('testFail')+': '+e.message,'err');}
  finally{btn.disabled=false;btn.textContent=ot;}
}
function showTR(m,tp){var el=$('testR');el.innerHTML='';var row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px';var msg=document.createElement('span');msg.style.flex='1';msg.textContent=m;var close=document.createElement('button');close.type='button';close.className='px';close.setAttribute('aria-label',t('close'));close.textContent='×';close.onclick=function(){el.style.display='none';};row.appendChild(msg);row.appendChild(close);el.appendChild(row);el.style.display='block';el.style.background=tp==='ok'?'rgba(48,209,88,.08)':tp==='info'?'var(--acg)':'rgba(255,69,58,.08)';el.style.color=tp==='ok'?'var(--ok)':tp==='info'?'var(--ac)':'var(--er)';el.style.border='0.5px solid '+(tp==='ok'?'rgba(48,209,88,.12)':tp==='info'?'rgba(var(--ac-rg),.12)':'rgba(255,69,58,.12)');el.style.borderRadius='var(--r3)';el.style.padding='8px 10px';}

/* ===== Diff ===== */
function diffHTML(a,b){var al=a.split('\n'),bl=b.split('\n'),h='',mx=Math.max(al.length,bl.length);for(var i=0;i<mx;i++){var o=al[i]||'',n=bl[i]||'';if(o===n)h+='<div style="padding:1px 6px;color:var(--tx3)">'+esc(o)+'</div>';else{if(o)h+='<div class="df-o">- '+esc(o)+'</div>';if(n)h+='<div class="df-n">+ '+esc(n)+'</div>';}}return h||'<span style="color:var(--tx3)">'+esc(t('emptyDiff'))+'</span>';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ===== History ===== */
function loadH(){var s=localStorage.getItem('bp_h');if(s)try{H=JSON.parse(s);}catch(e){}renderH();}
function addH(o,p,s,tone,purp){H.unshift({id:Date.now(),date:new Date().toLocaleString(),original:o,polished:p,suggestions:s,tone:tone,purpose:purp});if(H.length>50)H=H.slice(0,50);localStorage.setItem('bp_h',JSON.stringify(H));renderH();}
function renderH(){var el=$('hList'),ct=$('hCnt'),bd=$('hBdg');ct.textContent=H.length?'('+H.length+')':'';bd.textContent=H.length;H.length?bd.classList.remove('off'):bd.classList.add('off');if(!H.length){el.innerHTML='<div style="text-align:center;color:var(--tx3);padding:20px;font-size:13px;">'+t('noHistory')+'</div>';return;}el.innerHTML=H.map(function(h){return '<div class="hi" onclick="showDetail('+h.id+')"><div class="hm"><span>'+esc(h.date)+'</span><span style="cursor:pointer;color:var(--er);opacity:.5" onclick="event.stopPropagation();delH('+h.id+')">✕</span></div><div class="hp">'+esc(h.original.substring(0,80))+'…</div><div class="ht"><span class="tg">'+esc(h.tone)+'</span><span class="tg">'+esc(h.purpose)+'</span></div></div>';}).join('');}
function showDetail(id){var f=null;for(var i=0;i<H.length;i++)if(H[i].id===id){f=H[i];break;}if(!f)return;$('dCont').innerHTML='<strong>【'+t('original')+'】</strong>\n'+esc(f.original)+'\n\n<strong>【'+t('polished')+'】</strong>\n'+esc(f.polished)+'\n\n<strong>【'+t('suggestions')+'】</strong>\n'+esc(f.suggestions||'—');$('dMo').classList.add('show');window._dp=f.polished;}
function delH(id){H=H.filter(function(x){return x.id!==id;});localStorage.setItem('bp_h',JSON.stringify(H));renderH();toast(t('deleted'));}
function clrH(){if(!confirm(t('clearConfirm')))return;H=[];localStorage.removeItem('bp_h');renderH();toast(t('cleared'));}

/* ===== Modal ===== */
function closeMo(){$('dMo').classList.remove('show');}
function cpDetail(){cpTxt(window._dp||'');}

/* ===== Clipboard ===== */
function copyOut(){var tx=$('letterOut').value;if(!tx){toast(t('noResult'));return;}cpTxt(tx);}
function cpTxt(tx){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){toast(t('copied'));}).catch(function(){fbCp(tx);});}else fbCp(tx);}
function fbCp(tx){var a=document.createElement('textarea');a.value=tx;a.style.cssText='position:fixed;left:-9999px';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(t('copied'));}catch(e){toast(t('copyFail'));}document.body.removeChild(a);}
function dlResult(){var tx=$('letterOut').value;if(!tx){toast(t('noResult'));return;}var b=new Blob(['\uFEFF'+tx],{type:'text/plain;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='polished_'+new Date().toISOString().slice(0,10)+'.txt';a.click();URL.revokeObjectURL(a.href);toast(t('downloaded'));}

/* ===== Actions ===== */
function useAsIn(){var tx=$('letterOut').value;if(!tx)return;$('letterIn').value=tx;updCnt();window.scrollTo({top:0,behavior:'smooth'});toast(t('loadedAsIn'));}
function clearAll(){$('letterIn').value='';$('letterOut').value='';updCnt();$('diffV').innerHTML='<span style="color:var(--tx3)">'+esc(t('sugPlaceholder'))+'</span>';$('sugV').innerHTML='<span style="color:var(--tx3)">'+esc(t('sugPlaceholder2'))+'</span>';$('sts').classList.remove('show');$('pfB').classList.remove('show');resetTabs();}
function loadSample(){$('letterIn').value='王經理您好：\n\n感謝您上週撥冗與我們團隊進行會議，討論關於貴公司數位轉型專案的合作可能性。\n\n經過內部討論後，我們對於這個合作方向感到相當有興趣。我們認為我們的技術能力與貴公司的產業經驗可以產生很好的協同效應。\n\n關於合作方式，我們有以下初步想法：\n1. 第一階段：需求訪談與系統規劃（預計2週）\n2. 第二階段：原型開發與測試（預計6週）\n3. 第三階段：正式上線與後續維護\n\n預算方面，我們會在本週五前提供一份詳細的報價單給您參考。\n\n如果有任何問題，歡迎隨時與我聯繫。\n\n順頌商祺\n李小明\n業務經理\nXX 科技有限公司';updCnt();}

/* ===== Onboarding Guide ===== */
var guideStep=1,guideTotal=3;
function openGuide(){guideStep=1;updGuideUI();$('guideOv').classList.add('open');}
function guideOpenSettings(){$('guideOv').classList.remove('open');if(!$('sOv').classList.contains('open'))toggleSP();}
function closeGuide(){$('guideOv').classList.remove('open');localStorage.setItem('bp_guide_done','1');}
function skipGuide(){closeGuide();}
function guideNav(d){
  var ns=guideStep+d;
  if(ns>guideTotal){closeGuide();return;}
  if(ns<1)return;
  guideStep=ns;updGuideUI();
}
function updGuideUI(){
  document.querySelectorAll('.guide-step').forEach(function(el){el.classList.toggle('on',parseInt(el.getAttribute('data-guide'))===guideStep);});
  document.querySelectorAll('.guide-dot').forEach(function(el){el.classList.toggle('on',parseInt(el.getAttribute('data-gdot'))===guideStep);});
  $('guidePrev').style.display=guideStep===1?'none':'';
  var isLast=guideStep===guideTotal;
  document.getElementById('guideNextTxt').textContent=isLast?t('guideDone'):t('guideNext');
}

/* ===== Toast ===== */
function toast(m){var el=$('toast');el.textContent=m;el.classList.add('show');if(tt)clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show');},2200);}

/* ===== Keyboard ===== */
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('guideOv').classList.contains('open')){closeGuide();return;}closeMo();csCloseAll();if($('sOv').classList.contains('open'))toggleSP();if($('hOv').classList.contains('open'))toggleHP();}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){var a=document.activeElement;if(a&&a.id==='letterIn'){e.preventDefault();go();}}});

/* ===== Online Update ===== */
var APP_VERSION='2026.08.28';
var UPDATE_URL='https://raw.githubusercontent.com/2mf-hermes/BusinessLetterPolisher/main/version.json';
function checkForUpdate(){
  var btn=$('updBtn'),txt=$('updTxt');
  if(btn){btn.disabled=true;if(txt)txt.textContent=t('checking');}
  fetch(UPDATE_URL+'?_t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    if(btn){btn.disabled=false;if(txt)txt.textContent=t('checkUpdate');}
    if(!d.version)return;
    var remote=d.version.split('.').map(Number),local=APP_VERSION.split('.').map(Number);
    var newer=false;
    for(var i=0;i<Math.max(remote.length,local.length);i++){
      var r=remote[i]||0,l=local[i]||0;
      if(r>l){newer=true;break;}if(r<l)break;
    }
    if(newer){
      var notes='';
      if(d.release_notes){
        notes=d.release_notes[locale]||d.release_notes.en||'';
      }
      var msg=t('newVersion')+': '+d.version;
      if(notes)msg+='\n'+notes;
      if(d.download_url){
        msg+='\n\n'+t('clickToDownload');
        if(confirm(msg)){
          if(window.chrome&&window.chrome.webview){window.chrome.webview.postMessage(JSON.stringify({type:'installUpdate',url:d.download_url,version:d.version}));toast(t('downloadingUpdate'));}
          else{window.open(d.download_url,'_blank');}
        }
      }else{
        alert(msg);
      }
    }else{
      toast(t('upToDate'));
    }
  }).catch(function(e){
    if(btn){btn.disabled=false;if(txt)txt.textContent=t('checkUpdate');}
    toast(t('updateFail'));
  });
}
